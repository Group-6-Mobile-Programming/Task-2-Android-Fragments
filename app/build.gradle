plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uhc.healthconnect'
    compileSdk 34

    defaultConfig {
        applicationId "com.uhc.healthconnect"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Android Lint configuration enforcing Fragment best practices and CI/CD gating
    lint {
        abortOnError true
        checkReleaseBuilds false
        enable 'ValidFragment', 'UseGetContext'
        error 'ValidFragment', 'UseGetContext'
        warning 'NewApi', 'HardcodedText'
        baseline file("lint-baseline.xml")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}